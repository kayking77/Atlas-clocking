<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Atlas Timeclock Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <!-- Sign in -->
  <section id="view-login" class="auth" hidden>
    <form id="login-form" class="auth-card" novalidate>
      <div>
        <div class="wordmark">ATLAS</div>
        <p class="sub">Timeclock administration</p>
      </div>
      <label class="f">Email<input id="login-email" type="email" autocomplete="username" required></label>
      <label class="f">Password<input id="login-password" type="password" autocomplete="current-password" required></label>
      <div id="login-msg" class="msg bad" hidden></div>
      <button class="btn primary" type="submit" id="login-btn">Sign in</button>
    </form>
  </section>

  <!-- Two-factor code -->
  <section id="view-mfa" class="auth" hidden>
    <form id="mfa-form" class="auth-card" novalidate>
      <div>
        <div class="wordmark">ATLAS</div>
        <p class="sub">Enter the 6-digit code from your authenticator app.</p>
      </div>
      <label class="f">Code<input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label>
      <div id="mfa-msg" class="msg bad" hidden></div>
      <button class="btn primary" type="submit">Verify</button>
      <button class="btn" type="button" data-act="sign-out">Use a different account</button>
    </form>
  </section>

  <!-- Portal -->
  <div id="view-app" hidden>
    <header class="bar">
      <div class="bar-inner">
        <div class="wordmark">ATLAS<small>Timeclock</small></div>
        <nav class="tabs" role="tablist" aria-label="Sections">
          <button class="tab" role="tab" data-tab="live">On the clock</button>
          <button class="tab" role="tab" data-tab="timesheets">Timesheets</button>
          <button class="tab" role="tab" data-tab="houses">Organizations &amp; houses</button>
          <button class="tab" role="tab" data-tab="staff">Staff</button>
          <button class="tab" role="tab" data-tab="settings">Settings</button>
        </nav>
        <div class="who"><span id="who-name"></span><button type="button" data-act="sign-out">Sign out</button></div>
      </div>
    </header>
    <div class="demo-banner" role="note"><strong>Demo</strong> Sample data for the Sep 13–26, 2026 pay period. Browsing and Excel downloads work; changes aren’t saved.</div>
    <main id="main" aria-live="polite"></main>
  </div>

  <dialog id="dlg"><form id="dlg-form" method="dialog" novalidate></form></dialog>
  <div id="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/demo-supabase.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
